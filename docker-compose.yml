# Local Postgres for development. Not required if you use a hosted DB
# (Neon / Supabase / Railway) for the deployed environment.
version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ablespace
      POSTGRES_PASSWORD: ablespace
      POSTGRES_DB: ablespace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
